<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito | El Carrusel de la Mochila</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <video autoplay muted loop playsinline id="video-bg">
        <source src="vfondo.mp4" type="video/mp4">
    </video>

    <div class="main-container">
        <header>
            <h1>🛒 MI CARRITO DE COMPRAS</h1>
            <p class="tagline">Revisa tus mochilas seleccionadas antes de ordenar</p>
            
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Inicio</a></li>
                    <li>|</li>
                    <li><a href="Catalogo.html">Catálogo</a></li>
                    <li>|</li>
                    <li><a href="Contacto.html">Contacto</a></li>
                    <li>|</li>
                    <li><a href="carrito.html" class="active">🛒 Carrito</a></li>
                </ul>
            </nav>

            <button id="boton-modo" class="btn-modo">🌙 Modo Oscuro</button>
        </header>

        <hr class="separator">

        <!-- ESTRUCTURA INTEGRADA CON TU CONTENEDOR OSCURO TRANSPARENTE ORIGINAL -->
        <section class="cart-container" style="max-width: 600px; margin: 0 auto; padding: 20px; background: rgba(0, 0, 0, 0.75); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px;">
            <div id="cart-items">
                <!-- Se inyecta dinámicamente desde car.js con tus estilos -->
            </div>
            
            <div class="cart-summary-box" style="margin-top: 25px; padding-top: 20px; border-top: 2px dashed rgba(255,255,255,0.2); display: flex; justify-content: space-between; align-items: center; color: white;">
                <h3 style="margin: 0; font-size: 1.3em;">Total Estimado:</h3>
                <span id="cart-total" style="font-size: 1.5em; font-weight: bold; color: #ff7675;">$0.00 MXN</span>
            </div>

            <button onclick="checkoutWhatsApp()" class="btn-buy" style="display: block; width: 100%; margin-top: 20px; background: #25D366; color: white; border: none; padding: 12px; font-size: 1.2em; font-weight: bold; border-radius: 8px; cursor: pointer; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); transition: background 0.3s;">
                💬 Confirmar Pedido por WhatsApp
            </button>
        </section>

        <footer>
            <strong>© 2026 El Carrusel de la Mochila</strong>
        </footer>
    </div>

    <!-- LIBRERÍAS DE FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore-compat.js"></script>
    <script src="car.js"></script>
</body>
</html>
